{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ company_name|default:"S.D Enterprise" }}</title>
<meta name="description" content="Industrial supplies and services.">
<link href="{% static 'css/style.min.css' %}" rel="stylesheet">
<style>body { background:#f6f7fb; }</style>
</head>
<body>
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-7 text-center">
      <img src="{% static 'images/sd_enterprise.png' %}" alt="Logo"
           class="img-fluid mb-4" style="max-height:70px">
      <h1 class="h3">{{ company_name|default:"S.D Enterprise" }}</h1>
      <p class="text-muted">
        Supplier to the iron, steel, foundry and industrial gas sectors.
      </p>
      <a href="{% url 'login' %}" class="btn btn-primary">Staff sign in</a>
      <div class="mt-5 small text-muted">
        <a href="{% url 'privacy' %}">Privacy policy</a> ·
        <a href="{% url 'terms' %}">Terms</a>
      </div>
    </div>
  </div>
</div>
</body>
</html>
