# cp deploy/nginx.conf /etc/nginx/sites-available/leadcrm
# ln -s /etc/nginx/sites-available/leadcrm /etc/nginx/sites-enabled/
# nginx -t && systemctl reload nginx
#
# Then run certbot, which rewrites this file to add the TLS block:
#   certbot --nginx -d crm.yourdomain.in

server {
    listen 80;
    server_name crm.yourdomain.in;

    # Imported spreadsheets and email attachments.
    client_max_body_size 25M;

    # Static files are served by WhiteNoise inside the app, so there is no
    # separate location block for them to get out of step with.
    location / {
        proxy_pass         http://127.0.0.1:8001;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Django reads this to know the request arrived over HTTPS.
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_redirect     off;
        proxy_read_timeout 120s;
    }
}
