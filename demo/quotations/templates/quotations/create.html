{% extends 'base.html' %}
{% block title %}New Quotation{% endblock %}
{% block page_title %}New quotation for {{ company.company_name }}{% endblock %}

{% block content %}
<form method="post">
  {% csrf_token %}
  <div class="card"><div class="card-body">
    <h6 class="card-title">Items</h6>
    <div class="table-responsive">
      <table class="table table-sm align-middle" id="items">
        <thead><tr>
          <th style="min-width:200px">Description</th><th style="width:90px">Qty</th>
          <th style="width:120px">Rate (Rs)</th><th style="width:90px">Tax %</th>
          <th style="width:120px">Discount (Rs)</th><th style="width:40px"></th>
        </tr></thead>
        <tbody>
          <tr>
            <td><input name="description[]" class="form-control form-control-sm" required></td>
            <td><input name="quantity[]" type="number" step="0.01" value="1"
                       class="form-control form-control-sm"></td>
            <td><input name="rate[]" type="number" step="0.01" value="0"
                       class="form-control form-control-sm"></td>
            <td><input name="tax[]" type="number" step="0.01" value="18"
                       class="form-control form-control-sm"></td>
            <td><input name="discount[]" type="number" step="0.01" value="0"
                       class="form-control form-control-sm"></td>
            <td><button type="button" class="btn btn-sm btn-outline-danger remove">&times;</button></td>
          </tr>
        </tbody>
      </table>
    </div>
    <button type="button" class="btn btn-sm btn-outline-primary" id="add-row">
      + Add another item</button>
  </div></div>

  <div class="card"><div class="card-body">
    <div class="row g-3">
      <div class="col-md-4">
        <label class="form-label">Valid until</label>
        <input type="date" name="valid_until" class="form-control">
      </div>
      <div class="col-md-8">
        <label class="form-label">Terms</label>
        <textarea name="terms" rows="2" class="form-control">Payment within 30 days. Prices exclude freight unless stated.</textarea>
      </div>
      <div class="col-12">
        <label class="form-label">Notes</label>
        <textarea name="notes" rows="2" class="form-control"></textarea>
      </div>
    </div>
  </div></div>

  <button class="btn btn-primary">Create quotation</button>
  <a href="{% url 'leads:detail' lead.id %}" class="btn btn-link">Cancel</a>
</form>
{% endblock %}

{% block scripts %}
<script>
const body = document.querySelector('#items tbody');
document.getElementById('add-row').addEventListener('click', () => {
  const row = body.rows[0].cloneNode(true);
  row.querySelectorAll('input').forEach(input => {
    if (input.name === 'description[]') input.value = '';
    if (input.name === 'quantity[]') input.value = '1';
    if (input.name === 'rate[]' || input.name === 'discount[]') input.value = '0';
  });
  body.appendChild(row);
});
// One row must always remain, or the form has nothing to submit.
body.addEventListener('click', event => {
  if (event.target.classList.contains('remove') && body.rows.length > 1) {
    event.target.closest('tr').remove();
  }
});
</script>
{% endblock %}
