<div class="text-center py-5 text-muted">
  <i data-feather="{{ icon|default:'inbox' }}" style="width:42px;height:42px"></i>
  <p class="mt-3 mb-1">{{ title|default:"Nothing here yet" }}</p>
  {% if hint %}<small>{{ hint }}</small>{% endif %}
  {% if action_url %}
  <div class="mt-3"><a href="{{ action_url }}" class="btn btn-primary btn-sm">{{ action_label }}</a></div>
  {% endif %}
</div>
